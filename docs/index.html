<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='1' y='12' font-family='monospace' font-size='12' fill='%238ae234'%3E%E2%95%A6%E2%95%A6%3C/text%3E%3C/svg%3E">
<title>calvin — text into the Calvin S font</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #10131a; color: #d3d7cf; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         padding: 22px; box-sizing: border-box; }
  input { width: 100%; box-sizing: border-box; background: #171b24;
          color: #d3d7cf; border: 1px solid #2b3240; border-radius: 4px;
          padding: 10px 12px; font: inherit; font-size: 15px; }
  input:focus { outline: none; border-color: #729fcf; }
  h2 { font-size: 12px; font-weight: normal; color: #6b7280; margin: 22px 0 6px;
       text-transform: uppercase; letter-spacing: .08em; }
  /* The glyphs are three rows of box-drawing characters per letter, so the
     line height has to be exactly 1 or the rows pull apart and the letters
     stop joining up. */
  pre { margin: 0; padding: 14px; background: #0b0e14; border: 1px solid #1d222c;
        border-radius: 4px; overflow-x: auto; line-height: 1; font-size: 15px;
        color: #8ae234; }
  #bbb { color: #ad7fa8; font-size: 20px; line-height: 1.3; }
  #boot { color: #6b7280; }
</style>
</head>
<body>
<input id="in" value="calvin" spellcheck="false" autocomplete="off" aria-label="text to convert">
<h2>AsciiFont — Calvin S</h2>
<pre id="box"><span id="boot">loading…</span></pre>
<h2>BlackboardBold</h2>
<pre id="bbb"></pre>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("calvin.wasm"), go.importObject)
    .then((r) => go.run(r.instance))
    .catch((e) => { document.getElementById("box").textContent = "failed to load: " + e; });
</script>
</body>
</html>
